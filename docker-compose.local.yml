# Local development overrides — publish host ports:
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up --build
services:
  backend:
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data:ro
      - ./var/pricing:/var/lib/pricing
    environment:
      QUOTES_DB_PATH: /var/lib/pricing/quotes.db

  frontend:
    ports:
      - "3000:80"
