services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      CATALOG_PATH: /data/all_orders_merged.csv
    volumes:
      - ./data:/data:ro
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: ""
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
