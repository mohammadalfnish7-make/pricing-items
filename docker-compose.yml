services:
  backend:
    build: ./backend
    # Internal only — Coolify / frontend reach it as http://backend:8000
    # Do not publish host:8000 (conflicts with other apps / Coolify).
    expose:
      - "8000"
    environment:
      CATALOG_PATH: /data/all_orders_merged.csv
    volumes:
      - ./data:/data:ro
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: ""
    # Public HTTP port for Coolify reverse proxy (domain → service frontend, port 80).
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
